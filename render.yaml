services:
  - type: web
    name: santong-erp
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: 三通工程自動化管理系統
      - key: DEFAULT_ACTOR_CODE
        value: ADMIN001
      - key: TIMEZONE
        value: Asia/Taipei
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_WORKLOG_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_PUBLIC_SHARE
        value: "true"
      - key: DAILY_PUSH_HOUR
        value: "7"
      - key: DAILY_PUSH_MINUTE
        value: "0"
