services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: santong
      POSTGRES_USER: santong
      POSTGRES_PASSWORD: santong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_NAME: 三通工程自動化管理系統
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://santong:santong@db:5432/santong
      DEFAULT_ACTOR_CODE: ADMIN001
      TIMEZONE: Asia/Taipei
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      DAILY_PUSH_HOUR: 7
      DAILY_PUSH_MINUTE: 0
    ports:
      - "8000:8000"

volumes:
  postgres_data:

